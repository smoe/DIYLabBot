<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="850" viewBox="0 0 1150 850" role="img"><title>CF01 → NanoDrop → Qubit 4</title><rect width="100%" height="100%" fill="#eef2f6"/><g font-family="sans-serif" fill="#203b50"><text x="45" y="60" font-size="32">CF01 → NanoDrop → Qubit 4</text><text x="45" y="105" font-size="22">Schematischer Ablaufplan · ein Bestand · synthetische Eingaben</text><rect x="35" y="175" width="200" height="130" rx="12" fill="#d9e6ed" stroke="#496d83"/><text x="47" y="215" font-size="22">12 Originale</text><text x="47" y="260" font-size="14">Manifest / Rackplätze</text><text x="237" y="250" font-size="25">→</text><rect x="257" y="175" width="200" height="130" rx="12" fill="#d9e6ed" stroke="#496d83"/><text x="269" y="215" font-size="22">CF01</text><text x="269" y="260" font-size="14">beladen / Spin / zurück</text><text x="459" y="250" font-size="25">→</text><rect x="479" y="175" width="200" height="130" rx="12" fill="#d9e6ed" stroke="#496d83"/><text x="491" y="215" font-size="22">NanoDrop</text><text x="491" y="260" font-size="14">Entnahme / Ergebnis</text><text x="681" y="250" font-size="25">→</text><rect x="701" y="175" width="200" height="130" rx="12" fill="#d9e6ed" stroke="#496d83"/><text x="713" y="215" font-size="22">Qubit 4</text><text x="713" y="260" font-size="14">Ansatz / Messung</text><text x="903" y="250" font-size="25">→</text><rect x="923" y="175" width="200" height="130" rx="12" fill="#d9e6ed" stroke="#496d83"/><text x="935" y="215" font-size="22">Gesamtfreigabe</text><text x="935" y="260" font-size="14">Rückgabe / Entsorgung</text><text x="45" y="385" font-size="25">Eine Probe · ein Originalgefäß · derselbe Ursprungsplatz</text><text x="45" y="455" font-size="26">Originalbestand: 40 µl → 38,5 µl → 36,5 µl</text><text x="45" y="500" font-size="20">Geplanter Beispielsaldo; unbekannte Anfangsmengen bleiben unbekannt.</text><text x="45" y="565" font-size="22">Qubit: 2 Standards und 12 serielle Probenansätze.</text><text x="45" y="610" font-size="20">Ansatzgefäße besitzen eigene IDs und werden ausdrücklich entsorgt.</text><text x="45" y="710" font-size="22">Quelle und Ablaufplan sind kein Mess- oder Funktionsnachweis.</text><text x="45" y="755" font-size="20">Keine Netzwerk-, Hardware- oder Roboterbahnausführung.</text></g></svg>
