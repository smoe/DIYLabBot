name: Walkthrough regressions
on:
  push:
    branches: [master]
    paths: ['model/**', 'cad/vendor/**', 'scripts/**', 'tests/**', 'requirements/walkthrough-test.*', 'docs/building-furnishings*.json', '.github/workflows/walkthrough.yml']
  pull_request:
    paths: ['model/**', 'cad/vendor/**', 'scripts/**', 'tests/**', 'requirements/walkthrough-test.*', 'docs/building-furnishings*.json', '.github/workflows/walkthrough.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-publication-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FREECAD_APPIMAGE_URL: https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
      FREECAD_APPIMAGE_SHA256: f6dc6ba676e5ac96a565ebc8d657232f94c6158e85b4352141bd1a46f6b43434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema validators
        run: python -m pip install --require-hashes -r requirements/walkthrough-test.lock
      - name: Check strict test runner
        run: python scripts/check_walkthrough_regressions.py --pattern test_walkthrough_regressions.py --report exports/ci/walkthrough/runner.json
      - name: Prepare verified FreeCAD runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/freecad.AppImage" "$FREECAD_APPIMAGE_URL"
          printf '%s  %s\n' "$FREECAD_APPIMAGE_SHA256" "$RUNNER_TEMP/freecad.AppImage" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/freecad.AppImage"
          mkdir "$RUNNER_TEMP/freecad-runtime"
          cd "$RUNNER_TEMP/freecad-runtime"
          "$RUNNER_TEMP/freecad.AppImage" --appimage-extract > /dev/null
          cat > "$RUNNER_TEMP/freecad-python" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          task_freecad_root="$(dirname "$(readlink -f "$0")")/freecad-runtime/squashfs-root"
          export PYTHONPATH="$task_freecad_root/usr/lib"
          export PYTHONNOUSERSITE=1
          exec "$task_freecad_root/AppRun" python "$@"
          SH
          chmod +x "$RUNNER_TEMP/freecad-python"
          "$RUNNER_TEMP/freecad-python" -c 'import FreeCAD, Part; print("FreeCAD:", FreeCAD.Version()); assert FreeCAD.Version()[:3] == ["1", "1", "4"]'
          printf 'SOLIDCRAFTBOT_FREECAD_PYTHON=%s\n' "$RUNNER_TEMP/freecad-python" >> "$GITHUB_ENV"
      - name: Build and check current native L01 independently in FreeCAD
        run: python scripts/build_lab_layout.py --backend freecad
      - name: Check native build contracts
        run: |
          python scripts/check_walkthrough_regressions.py --pattern test_lab_layout_build.py --report exports/ci/walkthrough/native-contracts.json
          python scripts/check_walkthrough_regressions.py --pattern test_lab_layout_model.py --report exports/ci/walkthrough/native-layout.json
      - name: Check furniture, devices, door bindings and stale-publication detection
        run: |
          for suite in office_computers furniture_articulation building_furnishings building_laboratories typewide_articulations walkthrough_room_lift building_walkthrough building_walkthrough_export walkthrough_publication; do
            python scripts/check_walkthrough_regressions.py --pattern "test_${suite}.py" --report "exports/ci/walkthrough/${suite}.json" || exit 1
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check_walkthrough_interaction.cjs
      - run: node tests/check_walkthrough_lift.cjs
      - name: Retain test counts and native FreeCAD proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-checks-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            exports/ci/walkthrough/
            exports/generated/lab-layout-l01-*/build-report.json
            exports/generated/lab-layout-l01-*/layout-validation.json
            cad/generated/lab-layout-l01-*/LabLayout_L01.FCStd
