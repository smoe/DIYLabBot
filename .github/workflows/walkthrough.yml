name: Walkthrough regressions
on:
  push:
    branches: [master]
    paths: ['model/**', 'scripts/**', 'tests/**', 'docs/building-furnishings*.json', '.github/workflows/walkthrough.yml']
  pull_request:
    paths: ['model/**', 'scripts/**', 'tests/**', 'docs/building-furnishings*.json', '.github/workflows/walkthrough.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-publication-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check furniture, devices, door bindings and stale-publication detection
        run: |
          for suite in kitchen_3008 kitchen_actions kitchen_window_placement building_exterior building_plan_variants office_computers furniture_articulation building_furnishings building_laboratories typewide_articulations walkthrough_room_lift building_walkthrough building_walkthrough_export walkthrough_publication; do
            python -m unittest discover -s tests -p "test_${suite}.py" -v || exit 1
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check_walkthrough_interaction.cjs
      - run: node tests/check_walkthrough_lift.cjs
