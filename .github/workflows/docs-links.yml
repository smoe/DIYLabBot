name: Documentation links

# Renaming any target can break a link, even without a Markdown change.
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline-markdown-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository links and anchors without skips
        run: python scripts/check_walkthrough_regressions.py --pattern test_markdown_links.py --report exports/ci/docs-links/tests.json
